plugins {
    id 'com.android.application'
}

android {
    namespace 'de.trenits.talkshowgaeste'
    compileSdk 35

    defaultConfig {
        applicationId "de.trenits.talkshowgaeste"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "DATA_URL", "\"https://raw.githubusercontent.com/trenits-cmd/TalkshowGaeste/main/data/talkshows.json\""
        resourceConfigurations += ["de", "en"]
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
}
